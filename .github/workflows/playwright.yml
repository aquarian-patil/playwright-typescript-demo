name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          CI: true
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
          ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
          SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
          DUMMYJSON_PASSWORD: ${{ secrets.DUMMYJSON_PASSWORD }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 30

      - name: Upload CTRF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctrf-report-${{ matrix.browser }}-${{ matrix.shardIndex }}
          path: ctrf/
          retention-days: 30

  publish-report:
    name: Publish Test Report
    if: always()
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download CTRF results
        uses: actions/download-artifact@v4
        with:
          path: ctrf-reports
          pattern: ctrf-report-*
          merge-multiple: true

      - name: Merge CTRF Reports
        run: npx ctrf merge ctrf-reports/

      - name: Publish CTRF Test Summary Results
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: ctrf-reports/ctrf-report.json
